name: Firestore rules tests
# Runs the security-rules tests on GitHub's servers against the local emulator only
# (project id "demo-…" – no real Firebase project or customer data is touched).
on:
  push:
    paths: ['firestore.rules', 'tests/**', 'firebase.json', '.github/workflows/firestore-rules.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: npm ci
      - run: npm run test:rules
